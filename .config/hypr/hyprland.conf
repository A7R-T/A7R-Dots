# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor= HDMI-A-1, 1920x1080@60.00000, 0x0, 1
monitor =,1366x768@60.00000,0x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
#$EDITOR = codium --enable-features=UseOzonePlatform --ozone-platform=wayland
$EDITOR = kitty -e nvim

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = quickshell
# exec-once = $terminal
# eec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# Clipboard manager history
# Initialize the gnome keyring daemon for apps like Anytype
exec-once = gnome-keyring-daemon --start --components=secrets

# Update D-Bus and systemd environments with Wayland/Hyprland variables
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = killall xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Keep clipboard items after the source app closes
exec-once = wl-clip-persist --clipboard regular

exec-once = systemctl --user start hyprpolkitagent

exec-once = hypridle
exec-once = hyprlock
exec-once = nm-applet --indicator
# exec-once = waybar
exec-once = awww-daemon
exec-once = sudo NetworkManager
exec-once = hyprctl setcursor A7R-Cursor 37
exec-once = /usr/libexec/kf5/polkit-kde-authentication-agent-1 &
exec-once = xrandr --output HDMI-A-1 --primary
exec-once = sudo /usr/bin/nvidia-smi -lmc 2000,8501
exec-once = swaync

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_THEME,A7R-Cursor
env = XCURSOR_SIZE,37
env = HYPRCURSOR_SIZE,37
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OBSIDIAN_USE_WAYLAND,1
env = GTK_THEME,KittyDark
env = QT_QPA_PLATFORMTHEME,qt6ct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
